<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capibara Coloring Book</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --card: #ffffff;
      --text: #2b2620;
      --muted: #6e665c;
      --accent: #7a9a65;
      --accent-hover: #648251;
      --border: #e5dfd3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 560px;
      border-radius: 20px;
      padding: 28px 26px;
      box-shadow: 0 10px 30px rgba(43, 38, 32, 0.08);
      border: 1px solid var(--border);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .plate-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    select {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #faf8f4;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .impact-text {
      font-size: 1.22rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 12px;
    }

    .story-text {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 22px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    audio {
      width: 100%;
      border-radius: 999px;
      outline: none;
    }

    .welcome-screen {
      text-align: center;
    }

    .welcome-screen h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .welcome-screen p {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .lang-btn {
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #faf8f4;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lang-btn--center {
      grid-column: 1 / -1;
      justify-self: center;
      width: calc(50% - 6px);
    }

    .lang-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .saved-note {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--accent-hover);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main class="card" id="app"></main>

  <script src="data.js"></script>
  <script>
    const STORAGE_KEY = "capibara_lang";
    const SUPPORTED_LANGS = ["it", "en", "es", "fr", "de"];

    const UI_LABELS = {
      it: {
        welcomeTitle: "Capibara Coloring Book",
        welcomeSubtitle: "Scegli la tua lingua per leggere la storia e ascoltare la musica di ogni tavola.",
        savedMsg: "Lingua salvata! Ora puoi scansionare i QR code delle tavole.",
        platePrefix: "Tavola"
      },
      en: {
        welcomeTitle: "Capibara Coloring Book",
        welcomeSubtitle: "Choose your language to read the story and listen to the music for each page.",
        savedMsg: "Language saved! You can now scan the QR codes on each page.",
        platePrefix: "Plate"
      },
      es: {
        welcomeTitle: "Capibara Coloring Book",
        welcomeSubtitle: "Elige tu idioma para leer la historia y escuchar la música de cada lámina.",
        savedMsg: "¡Idioma guardado! Ya puedes escanear los códigos QR de las láminas.",
        platePrefix: "Lámina"
      },
      fr: {
        welcomeTitle: "Capibara Coloring Book",
        welcomeSubtitle: "Choisissez votre langue pour lire l'histoire et écouter la musique de chaque planche.",
        savedMsg: "Langue enregistrée ! Vous pouvez maintenant scanner les QR codes des planches.",
        platePrefix: "Planche"
      },
      de: {
        welcomeTitle: "Capibara Coloring Book",
        welcomeSubtitle: "Wähle deine Sprache, um die Geschichte zu lesen und die Musik jeder Tafel zu hören.",
        savedMsg: "Sprache gespeichert! Du kannst jetzt die QR-Codes der Tafeln scannen.",
        platePrefix: "Tafel"
      }
    };

    function getSavedLang() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return SUPPORTED_LANGS.includes(saved) ? saved : "it";
    }

    function setSavedLang(lang) {
      if (SUPPORTED_LANGS.includes(lang)) {
        localStorage.setItem(STORAGE_KEY, lang);
      }
    }

    function getPlateParam() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get("tavola");
      if (!raw) return null;
      return raw.padStart(2, "0");
    }

    function formatTitle(id) {
      return id.replace(/^\d+_/, "").replace(/_/g, " ");
    }

    function renderWelcome(lang) {
      const t = UI_LABELS[lang] || UI_LABELS.it;
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="welcome-screen">
          <h1>${t.welcomeTitle}</h1>
          <p>${t.welcomeSubtitle}</p>
          <div class="lang-grid">
            <button class="lang-btn" data-lang="it">🇮🇹 Italiano</button>
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
            <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
            <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
            <button class="lang-btn lang-btn--center" data-lang="de">🇩🇪 Deutsch</button>
          </div>
          <div class="saved-note" id="saved-note"></div>
        </div>
      `;

      app.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const chosen = btn.getAttribute("data-lang");
          setSavedLang(chosen);
          const updated = UI_LABELS[chosen];
          app.querySelector("h1").textContent = updated.welcomeTitle;
          app.querySelector("p").textContent = updated.welcomeSubtitle;
          document.getElementById("saved-note").textContent = updated.savedMsg;
        });
      });
    }

    function renderPlate(plateId, lang) {
      const plate = (typeof CAPIBARA_DATA !== "undefined" && CAPIBARA_DATA[plateId])
        ? CAPIBARA_DATA[plateId]
        : null;

      if (!plate) {
        renderWelcome(lang);
        return;
      }

      const t = UI_LABELS[lang] || UI_LABELS.it;
      const phrase = (plate.phrases && (plate.phrases[lang] || plate.phrases.it)) || "";
      const story = (plate.story && (plate.story[lang] || plate.story.it)) || "";
      const titleText = formatTitle(plate.id);
      const app = document.getElementById("app");

      app.innerHTML = `
        <div class="top-bar">
          <div class="plate-title">${t.platePrefix} #${plateId} — ${titleText}</div>
          <select id="lang-select" aria-label="Language">
            <option value="it" ${lang === "it" ? "selected" : ""}>Italiano</option>
            <option value="en" ${lang === "en" ? "selected" : ""}>English</option>
            <option value="es" ${lang === "es" ? "selected" : ""}>Español</option>
            <option value="fr" ${lang === "fr" ? "selected" : ""}>Français</option>
            <option value="de" ${lang === "de" ? "selected" : ""}>Deutsch</option>
          </select>
        </div>
        <p class="impact-text">${phrase}</p>
        ${story ? `<p class="story-text">${story}</p>` : ""}
        <audio controls preload="none" src="${plate.audio}"></audio>
      `;

      document.getElementById("lang-select").addEventListener("change", (e) => {
        const newLang = e.target.value;
        setSavedLang(newLang);
        renderPlate(plateId, newLang);
      });
    }

    (function init() {
      const lang = getSavedLang();
      const plateId = getPlateParam();
      if (plateId) {
        renderPlate(plateId, lang);
      } else {
        renderWelcome(lang);
      }
    })();
  </script>
</body>
</html>
